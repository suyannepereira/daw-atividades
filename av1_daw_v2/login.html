<!--Essa parte é responsável por mostrar a tela de login-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Login</h2>

<form id="formLogin">

    <!--Esses campos "input" recebem os dados do usuário-->

    <input
        type="text"
        id="email"
        placeholder="Email"
        required
    ><br>

    <input
        type="password"
        id="senha"
        placeholder="Senha"
        required
    ><br>

    <button type="submit">
        Entrar
    </button>

</form>

<p>
    Não tem conta?
    <a href="cadastro.html">Cadastrar</a>
</p>

<script src="login.js"></script>

</body>
</html>
